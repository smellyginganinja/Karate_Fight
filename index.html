<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Karate Fight</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#120c0a;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#fff}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Shared helpers, storage and keyboard input. Loaded first. */

// ---------- canvas ----------
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
function resize() {
  DPR = window.devicePixelRatio || 1; VW = innerWidth; VH = innerHeight;
  cvs.width = Math.round(VW * DPR); cvs.height = Math.round(VH * DPR);
  cvs.style.width = VW + 'px'; cvs.style.height = VH + 'px';
}
addEventListener('resize', resize); resize();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

const store = {
  get(k, d) { try { const v = localStorage.getItem('karatefight.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('karatefight.' + k, JSON.stringify(v)); } catch (e) {} }
};

// ---------- keyboard ----------
// keys: held state. pressed: edge flags for menus (cleared each frame).
// presses: running count of keydowns per key, so a tap shorter than one game step is never lost
// (the fight sim and online play compare counts rather than held state for punch, kick and jump).
const keys = {}, pressed = {}, presses = {};
addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab', 'Slash', 'Period', 'Comma', 'Quote'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) { pressed[e.code] = true; presses[e.code] = (presses[e.code] || 0) + 1; }
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const tap = code => { if (pressed[code]) { pressed[code] = false; return true; } return false; };

</script>
<script>
/* Sound: small Web Audio synth for fight sounds, crowd cheers and the chiptune music (no audio
   files). Every entry point is wrapped in try/catch and nothing plays until a key press or click
   has unlocked audio. M mutes everything, N turns the music on and off. */
const Sound = (() => {
  let ac = null, master = null, noise = null, muted = !!store.get('muted', false);
  const safe = fn => (...a) => { try { return fn(...a); } catch (e) {} };
  function init() {
    if (ac) { if (ac.state !== 'running' && !document.hidden) ac.resume().then(safe(applySong)); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); master = ac.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(ac.destination);
    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  // every kind of first touch, click or key press can unlock audio (Safari is picky about which count)
  const UNLOCK = ['keydown', 'keyup', 'pointerdown', 'mousedown', 'click', 'touchstart', 'touchend'];
  UNLOCK.forEach(e => addEventListener(e, safe(init), { passive: true, capture: true }));

  function env(g, t, a, peak, dec) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec); }
  function tone(type, f0, f1, dur, vol, delay) {
    const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    env(g, t, 0.005, vol, dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function hiss(freq, q, dur, vol, delay, sweepTo) {
    const t = ac.currentTime + (delay || 0), s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise; f.type = 'bandpass'; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    env(g, t, 0.01, vol, dur); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
  }
  const fx = {
    swing: () => hiss(900, 1.2, 0.16, 0.35, 0, 2600),
    jump: () => tone('triangle', 220, 440, 0.12, 0.15),
    land: () => tone('sine', 120, 60, 0.08, 0.25),
    hit: p => { tone('sine', 160, 45, 0.22, 0.9); hiss(2400, 0.8, 0.07, 0.6); if (p >= 2) tone('square', 660, 640, 0.35, 0.12, 0.08); },
    block: () => { hiss(3200, 4, 0.05, 0.5); tone('square', 900, 700, 0.04, 0.1); },
    clash: () => { hiss(3000, 3, 0.08, 0.6); tone('square', 1200, 900, 0.06, 0.12); },
    begin: () => { tone('square', 523, 523, 0.12, 0.12); tone('square', 784, 784, 0.22, 0.12, 0.12); },
    roundOver: () => [392, 523, 659, 784].forEach((n, i) => tone('triangle', n, n, 0.25, 0.18, i * 0.12)),
    time: () => tone('square', 330, 330, 0.5, 0.15),
    menuMove: () => tone('square', 660, 660, 0.04, 0.06),
    menuSelect: () => { tone('square', 660, 660, 0.05, 0.08); tone('square', 990, 990, 0.08, 0.08, 0.05); }
  };

  // ---------- crowd ----------
  // A cheer: a filtered-noise roar, a handful of rising "hey!" voices, scattered claps and,
  // for full points and up, a whistle. size: 1 half point, 2 full point, 3 round, 4 match.
  function voice(t, f0, dur, vol) {
    const o = ac.createOscillator(), g = ac.createGain(), out = ac.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f0 * 1.3, t + 0.18); o.frequency.exponentialRampToValueAtTime(f0 * 0.9, t + dur);
    [[720, 5], [1150, 6], [2500, 8]].forEach(([fr, q], i) => {           // rough "ay" vowel formants
      const b = ac.createBiquadFilter(); b.type = 'bandpass'; b.frequency.value = fr * (0.95 + Math.random() * 0.1); b.Q.value = q;
      const bg = ac.createGain(); bg.gain.value = [1, 0.7, 0.25][i]; o.connect(b); b.connect(bg); bg.connect(g);
    });
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.06);
    g.gain.setValueAtTime(vol, t + dur * 0.5); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(out); out.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function roar(t, freq, q, vol, rise, dur) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise; s.loop = true; s.playbackRate.value = 0.8 + Math.random() * 0.4;
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + rise);
    g.gain.setTargetAtTime(0.0001, t + rise + dur * 0.25, dur * 0.3);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + rise + dur * 1.6);
  }
  function cheer(size) {
    const t = ac.currentTime + 0.03, dur = 0.8 + size * 0.5, vol = 0.12 + size * 0.06;
    roar(t, 700, 0.6, vol, 0.12, dur);
    roar(t, 1800, 1.2, vol * 0.45, 0.15, dur * 0.9);
    for (let i = 0; i < 3 + size * 3; i++) voice(t + Math.random() * 0.25 * size, 150 + Math.random() * 260, 0.35 + Math.random() * 0.5, 0.05 + Math.random() * 0.03);
    for (let i = 0; i < size * 7; i++) hiss(1500 + Math.random() * 1500, 1.5, 0.03, 0.18 + Math.random() * 0.15, 0.08 + Math.random() * dur * 0.8);
    if (size >= 2) {                                                         // two-finger whistle
      const o = ac.createOscillator(), g = ac.createGain(), w = t + 0.15 + Math.random() * 0.2;
      o.type = 'sine'; o.frequency.setValueAtTime(1900, w); o.frequency.exponentialRampToValueAtTime(2700, w + 0.12);
      o.frequency.setValueAtTime(2700, w + 0.3); o.frequency.exponentialRampToValueAtTime(2200, w + 0.5);
      env(g, w, 0.03, 0.05, 0.5); o.connect(g); g.connect(master); o.start(w); o.stop(w + 0.6);
    }
  }
  fx.cheer = cheer;

  // low crowd murmur under the fight music
  let murmur = null;
  function murmurOn(on) {
    if (on && !murmur) {
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
      s.buffer = noise; s.loop = true; s.playbackRate.value = 0.5;
      f.type = 'bandpass'; f.frequency.value = 450; f.Q.value = 0.8;
      g.gain.setValueAtTime(0.0001, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.03, ac.currentTime + 1.5);
      lfo.frequency.value = 0.23; lg.gain.value = 0.01; lfo.connect(lg); lg.connect(g.gain);
      s.connect(f); f.connect(g); g.connect(master); s.start(); lfo.start();
      murmur = { s, g, lfo };
    } else if (!on && murmur) {
      const m = murmur, t = ac.currentTime; murmur = null;
      m.g.gain.cancelScheduledValues(t); m.g.gain.setValueAtTime(m.g.gain.value, t); m.g.gain.linearRampToValueAtTime(0, t + 0.4);
      m.s.stop(t + 0.5); m.lfo.stop(t + 0.5);
    }
  }

  // ---------- music ----------
  // Original chiptune loops in an A minor pentatonic, arcade style: a pulse-wave lead with a
  // short echo, a triangle bass and noise drums. Notes are written one token per 16th note:
  // a note name starts a note, '-' holds it, '.' is a rest.
  const midi = n => { const m = /^([A-G])([#b]?)(\d)$/.exec(n); return 12 * (+m[3] + 1) + { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0); };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function parse(str) {                      // -> array indexed by step of [midi, lengthInSteps] or null
    const tok = str.trim().split(/\s+/), out = new Array(tok.length).fill(null);
    let last = -1;
    tok.forEach((k, i) => { if (k === '-') { if (last >= 0) out[last][1]++; } else if (k === '.') last = -1; else { out[i] = [midi(k), 1]; last = i; } });
    return out;
  }
  // bass bar: pattern tokens 0 = root, 1 = root an octave up, 5 = the fifth, '.' rest, '-' hold
  const bassBar = (root, pat) => pat.split(' ').map(k => k === '.' || k === '-' ? k : root.replace(/\d/, d => +d + (k === '1' ? 1 : 0)) + (k === '5' ? '+7' : '')).join(' ');
  function parseBass(bars) {
    return parse(bars.map(([r, p]) => bassBar(r, p)).join(' ').replace(/(\S+)\+7/g, (a, n) => { const m = midi(n) + 7, names = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B']; return names[m % 12] + (Math.floor(m / 12) - 1); }));
  }
  const SONGS = {
    // menu: relaxed, 112 bpm, 8 bars
    menu: {
      bpm: 112,
      lead: parse(`
        A4 - - - C5 - D5 - E5 - - - D5 - C5 -   D5 - - - E5 - G5 - E5 - D5 - C5 - - -
        A4 - - - C5 - D5 - E5 - G5 - A5 - - -   G5 - E5 - D5 - E5 - A4 - - - - - . .
        C5 - - - D5 - E5 - G5 - - - E5 - D5 -   E5 - - - D5 - C5 - D5 - - - - - . .
        A5 - G5 - E5 - D5 - E5 - G5 - E5 - D5 -  C5 - D5 - B4 - - - A4 - - - - - . .`),
      bass: parseBass([['A2', '0 - . 1 . 5 . 1 0 - . 1 . 5 . 1'], ['D2', '0 - . 1 . 5 . 1 0 - . 1 . 5 . 1'], ['A2', '0 - . 1 . 5 . 1 0 - . 1 . 5 . 1'], ['E2', '0 - . 1 . 5 . 1 0 - . 1 . 5 . 1'],
                       ['F2', '0 - . 1 . 5 . 1 0 - . 1 . 5 . 1'], ['G2', '0 - . 1 . 5 . 1 0 - . 1 . 5 . 1'], ['F2', '0 - . 1 . 5 . 1 0 - . 1 . 5 . 1'], ['E2', '0 - . 1 . 5 . 1 0 - . 1 0 1 0']]),
      drums: 'k . h . s . h . k . h k s . h .',
      vol: 0.8
    },
    // fight: driving, 150 bpm, 8 bars
    fight: {
      bpm: 150,
      lead: parse(`
        A4 . A4 . C5 . A4 . D5 . C5 . A4 . G4 .   A4 . A4 . C5 . D5 . E5 - - . D5 . C5 .
        A4 . A4 . C5 . A4 . D5 . C5 . A4 . G4 .   E5 . D5 . C5 . D5 . A4 - - - - - . .
        E5 - - . G5 - - . A5 - - . G5 . E5 .   D5 - - . E5 - - . G5 - E5 - D5 . C5 .
        E5 - - . G5 - - . A5 - - . C6 . A5 .   G5 . E5 . D5 . C5 . D5 - - - E5 - - -`),
      bass: parseBass([['A2', '0 0 1 0 0 0 1 0 0 0 1 0 0 0 1 0'], ['A2', '0 0 1 0 0 0 1 0 0 0 1 0 5 5 1 5'], ['A2', '0 0 1 0 0 0 1 0 0 0 1 0 0 0 1 0'], ['E2', '0 0 1 0 0 0 1 0 0 0 1 0 0 1 0 1'],
                       ['C3', '0 0 1 0 0 0 1 0 0 0 1 0 0 0 1 0'], ['D3', '0 0 1 0 0 0 1 0 0 0 1 0 0 0 1 0'], ['F2', '0 0 1 0 0 0 1 0 0 0 1 0 0 0 1 0'], ['E2', '0 0 1 0 0 0 1 0 5 5 1 5 1 0 1 0']]),
      drums: 'k . h . s . h k k . h . s . h h',
      vol: 0.7
    }
  };
  let pulse = null, musicBus = null, echo = null, song = null, songName = null, wantSong = null, step = 0, nextT = 0;
  let musicOn = store.get('music', true) !== false;
  function musicInit() {
    if (musicBus) return;
    const n = 32, re = new Float32Array(n), im = new Float32Array(n);
    for (let i = 1; i < n; i++) re[i] = 2 / (i * Math.PI) * Math.sin(i * Math.PI * 0.25);   // 25% pulse wave
    pulse = ac.createPeriodicWave(re, im);
    musicBus = ac.createGain(); musicBus.gain.value = 0; musicBus.connect(master);
    echo = ac.createDelay(1); const fb = ac.createGain(), wet = ac.createGain();
    fb.gain.value = 0.28; wet.gain.value = 0.3; echo.connect(fb); fb.connect(echo); echo.connect(wet); wet.connect(musicBus);
  }
  function note(type, f, t, len, vol, toEcho) {
    const o = ac.createOscillator(), g = ac.createGain();
    if (type === 'pulse') o.setPeriodicWave(pulse); else o.type = type;
    o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.006);
    g.gain.setValueAtTime(vol * 0.75, t + Math.min(0.05, len * 0.3)); g.gain.setValueAtTime(vol * 0.75, t + len * 0.85); g.gain.linearRampToValueAtTime(0, t + len);
    o.connect(g); g.connect(musicBus); if (toEcho) g.connect(echo); o.start(t); o.stop(t + len + 0.02);
  }
  function drum(k, t) {
    if (k === 'k') { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12); env(g, t, 0.003, 0.5, 0.13); o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.2); }
    else {
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), d = k === 's' ? 0.12 : 0.03;
      s.buffer = noise; s.playbackRate.value = 1 + Math.random() * 0.2; f.type = k === 's' ? 'bandpass' : 'highpass'; f.frequency.value = k === 's' ? 1800 : 7000; f.Q.value = 0.7;
      env(g, t, 0.002, k === 's' ? 0.35 : 0.12, d); s.connect(f); f.connect(g); g.connect(musicBus); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.03);
    }
  }
  const DRUMS = {};
  function tick() {
    if (!ac || ac.state !== 'running' || !song) return;
    const sp = 60 / song.bpm / 4, len = song.lead.length;
    if (nextT < ac.currentTime) nextT = ac.currentTime + 0.05;
    const dr = DRUMS[songName] || (DRUMS[songName] = song.drums.split(' '));
    while (nextT < ac.currentTime + 0.2) {
      const L = song.lead[step], B = song.bass[step % song.bass.length], D = dr[step % dr.length];
      if (L) note('pulse', hz(L[0]), nextT, L[1] * sp * 0.95, 0.09 * song.vol, true);
      if (B) note('triangle', hz(B[0]), nextT, B[1] * sp * 0.9, 0.22 * song.vol);
      if (D !== '.') drum(D, nextT);
      step = (step + 1) % len; nextT += sp;
    }
  }
  setInterval(safe(tick), 40);
  function applySong() {
    if (!ac) return;
    musicInit();
    murmurOn(wantSong === 'fight');
    const name = musicOn ? wantSong : null;
    if (name === songName) return;
    const t = ac.currentTime;
    musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value, t);
    if (!name) { musicBus.gain.linearRampToValueAtTime(0, t + 0.3); song = null; songName = null; return; }
    // fade out what is playing, then start the new loop from the top
    musicBus.gain.linearRampToValueAtTime(0, t + 0.15); musicBus.gain.linearRampToValueAtTime(1, t + 0.35);
    song = SONGS[name]; songName = name; step = 0; nextT = t + 0.2;
  }
  // pause everything while the tab is hidden (timers are throttled there, which would garble the music)
  document.addEventListener('visibilitychange', safe(() => { if (!ac) return; if (document.hidden) ac.suspend(); else ac.resume(); }));
  UNLOCK.forEach(e => addEventListener(e, safe(applySong), { passive: true, capture: true }));

  return {
    get muted() { return muted; },
    get musicOn() { return musicOn; },
    play: safe((name, arg) => { if (!ac || muted || !fx[name]) return; fx[name](arg); }),
    // play the sounds for a step's fight events; the crowd cheers every point scored and every round won
    events: safe(evs => {
      for (const e of evs) {
        if (e.type === 'hit') { Sound.play('hit', e.points); Sound.play('cheer', e.points >= 2 ? 2 : 1); }
        else if (e.type === 'roundOver') { Sound.play('roundOver'); if (e.by >= 0) Sound.play('cheer', 3); }
        else if (e.type === 'matchOver') Sound.play('cheer', 4);
        else if (e.type !== 'whiff') Sound.play(e.type);
      }
    }),
    // choose the background loop: 'menu', 'fight' or null. Cheap to call every frame.
    music: safe(name => { if (name === wantSong) return; wantSong = name; applySong(); }),
    toggleMute: safe(() => { muted = !muted; store.set('muted', muted); if (master) master.gain.value = muted ? 0 : 0.6; }),
    toggleMusic: safe(() => { musicOn = !musicOn; store.set('music', musicOn); applySong(); })
  };
})();

</script>
<script>
/* Gamepads: polls up to two connected pads once per frame.
   pads[0] is player 1's and pads[1] player 2's in 2-player mode. Any pad can also drive the menus.
   Mapping (standard layout): left stick or d-pad to move (up jumps, down crouches),
   X/Square punch, B/Circle or Y/Triangle kick, A/Cross jump, Start pause, Back/Select menu. */
const GamepadInput = (() => {
  const blank = () => ({ active: false, l: false, r: false, u: false, d: false, pc: 0, kc: 0, jc: 0 });
  const pads = [blank(), blank()];
  const st = [{ prev: [], up: false, dir: 0 }, { prev: [], up: false, dir: 0 }];
  const DZ = 0.4;

  function list() {
    if (typeof navigator === 'undefined' || !navigator.getGamepads) return [];
    const all = Array.from(navigator.getGamepads() || []).filter(Boolean);
    return all.filter(p => p.mapping === 'standard').concat(all.filter(p => p.mapping !== 'standard')).slice(0, 2);
  }

  function pollPad(pad, c, s) {
    const btn = i => !!(pad.buttons[i] && pad.buttons[i].pressed);
    const edge = i => btn(i) && !s.prev[i];
    const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
    c.l = btn(14) || ax < -DZ; c.r = btn(15) || ax > DZ;
    c.u = btn(12) || ay < -0.6; c.d = btn(13) || ay > 0.6;
    if (pad.buttons.some(b => b && b.pressed) || Math.abs(ax) > DZ || Math.abs(ay) > DZ) c.active = true;
    if (edge(2)) c.pc++;
    if (edge(1) || edge(3)) c.kc++;
    if (edge(0) || (c.u && !s.up)) c.jc++;
    s.up = c.u;
    // menus
    const dir = c.l ? -1 : c.r ? 1 : 0;
    if (dir && dir !== s.dir) pressed[dir < 0 ? 'ArrowLeft' : 'ArrowRight'] = true;
    s.dir = dir;
    if (edge(12) || (ay < -0.6 && !s.prevUpMenu)) pressed.ArrowUp = true;
    if (edge(13) || (ay > 0.6 && !s.prevDownMenu)) pressed.ArrowDown = true;
    s.prevUpMenu = ay < -0.6; s.prevDownMenu = ay > 0.6;
    if (edge(0)) pressed.Enter = true;
    if (edge(9)) pressed.KeyP = true;
    if (edge(8)) pressed.Escape = true;
    s.prev = pad.buttons.map(b => !!(b && b.pressed));
  }

  return {
    pads,
    poll() {
      try {
        const l = list();
        for (let k = 0; k < 2; k++) {
          if (l[k]) pollPad(l[k], pads[k], st[k]);
          else { Object.assign(pads[k], { active: false, l: false, r: false, u: false, d: false }); st[k].prev = []; }
        }
      } catch (e) { pads.forEach(c => { c.active = false; }); }
    }
  };
})();

</script>
<script>
/* Fight: the match simulation. Pure game rules, no drawing, no sound, no DOM.
   The host (or the local game) owns a match and calls Fight.step(match, [input0, input1], dt)
   at a fixed rate. render.js reads the match to draw it; net play sends Fight.snapshot(match).

   Coordinates: x runs 0..ARENA_W left to right; a fighter's y is its height ABOVE the floor
   (0 = standing on it). On screen the floor line sits at FLOOR_Y in a 960 x 540 logical stage.

   An input is { l, r, u, d, pc, kc, jc }: l/r/u/d are held directions, and pc/kc/jc are running
   press counts for punch, kick and jump. A press is "the count went up since last step", so a
   quick tap is never missed, even online.

   Scoring: a clean hit scores a half point (1) or a full point (2). The first fighter to 2 full
   points (score 4) takes the round; first to 2 rounds wins the match. After every point both
   fighters go back to their marks. A round that times out goes to the higher score; a tie is a
   draw and the round is fought again. */
const Fight = (() => {
  const ARENA_W = 960, FLOOR_Y = 440, STAGE_H = 540;
  const START_X = [330, 630];
  const EDGE = 40, MIN_GAP = 64;
  const WALK = 210, BACK_WALK = 165, JUMP_V = 735, JUMP_X = 215, GRAV = 2500;
  const ROUND_TIME = 30, POINTS_TO_WIN = 4, ROUNDS_TO_WIN = 2;
  const STAND_H = 150, CROUCH_H = 95;
  // phase lengths in seconds
  const T_INTRO = 1.9, T_REMARK = 1.2, T_POINT = 2.0, T_ROUND = 2.8;

  // Moves. startup/active/recover in seconds. reach: how far in front of the attacker's centre it lands.
  // height: 'high' misses a crouching fighter, 'low' misses a jumping one, 'mid' hits both standing and crouching.
  // points: 1 = half point, 2 = full point. crouch: done from a crouch. air: done in a jump.
  // step: forward speed during startup (a lunge).
  const MOVES = {
    jab:        { startup: 0.06, active: 0.08, recover: 0.14, reach: 82,  height: 'high', points: 1 },
    lunge:      { startup: 0.10, active: 0.08, recover: 0.22, reach: 96,  height: 'mid',  points: 1, step: 230 },
    lowpunch:   { startup: 0.07, active: 0.08, recover: 0.16, reach: 78,  height: 'mid',  points: 1, crouch: true },
    frontkick:  { startup: 0.12, active: 0.10, recover: 0.22, reach: 106, height: 'mid',  points: 1 },
    roundhouse: { startup: 0.20, active: 0.10, recover: 0.30, reach: 118, height: 'high', points: 2 },
    spinkick:   { startup: 0.26, active: 0.10, recover: 0.34, reach: 130, height: 'high', points: 2 },
    sweep:      { startup: 0.16, active: 0.12, recover: 0.34, reach: 116, height: 'low',  points: 2, crouch: true },
    flykick:    { startup: 0.08, active: 0.30, recover: 0.12, reach: 100, height: 'high', points: 2, air: true }
  };
  // SPEED > 1 makes every move quicker than the table above (1.2 = 20% faster).
  const SPEED = 1.2;
  for (const k in MOVES) for (const p of ['startup', 'active', 'recover']) MOVES[k][p] = Math.round(MOVES[k][p] / SPEED * 1000) / 1000;
  const MOVE_NAMES = Object.keys(MOVES);
  // Fighter states (act). How long the timed ones last:
  const ACTS = ['idle', 'walk', 'crouch', 'block', 'jump', 'attack', 'hit', 'down', 'win', 'lose'];
  const T_BLOCK = 0.18, T_HIT = 0.45, T_DOWN = 1.6;

  const NEUTRAL = { l: false, r: false, u: false, d: false, pc: 0, kc: 0, jc: 0 };

  function newFighter(idx, opts) {
    return { idx, name: opts.name || ('Player ' + (idx + 1)), color: opts.color || (idx ? 'red' : 'white'),
      x: START_X[idx], y: 0, vx: 0, vy: 0, facing: idx ? -1 : 1,
      act: 'idle', move: null, t: 0, phase: null, connected: false,
      crouch: false, walking: 0, blocking: false,
      score: 0, rounds: 0, lp: null, lk: null, lj: null };
  }

  function create(opts) {
    opts = opts || {};
    const M = { ARENA_W, FLOOR_Y, phase: 'intro', phaseT: 0, round: 1, timer: ROUND_TIME, message: 'ROUND 1',
      fighters: [newFighter(0, opts.p1 || {}), newFighter(1, opts.p2 || {})], events: [], winner: -1, pointBy: -1, time: 0, introLong: true,
      stage: opts.stage != null ? opts.stage | 0 : Math.floor(Math.random() * 1000) };   // render.js picks the place from this
    return M;
  }

  function toMarks(M) {
    M.fighters.forEach((f, i) => Object.assign(f, { x: START_X[i], y: 0, vx: 0, vy: 0, facing: i ? -1 : 1, act: 'idle', move: null, t: 0,
      phase: null, connected: false, crouch: false, walking: 0, blocking: false }));
  }
  function setPhase(M, p, msg) { M.phase = p; M.phaseT = 0; if (msg !== undefined) M.message = msg; }
  const ev = (M, type, extra) => M.events.push(Object.assign({ type }, extra || {}));

  // ---------- one fighter ----------
  function moveFor(f, inp, punch, kick) {
    const fwd = f.facing > 0 ? inp.r : inp.l, back = f.facing > 0 ? inp.l : inp.r;
    if (punch) return inp.d ? 'lowpunch' : fwd ? 'lunge' : 'jab';
    if (kick) return inp.d ? 'sweep' : fwd ? 'roundhouse' : back ? 'spinkick' : 'frontkick';
    return null;
  }
  function attackPhase(f) {
    const mv = MOVES[f.move];
    if (f.t < mv.startup) return 'startup';
    if (f.t < mv.startup + mv.active) return 'active';
    return 'recover';
  }

  function updFighter(M, f, o, inp, dt, live) {
    const punch = f.lp !== null && inp.pc !== f.lp, kick = f.lk !== null && inp.kc !== f.lk, jump = f.lj !== null && inp.jc !== f.lj;
    f.lp = inp.pc; f.lk = inp.kc; f.lj = inp.jc;
    const fwd = f.facing > 0 ? inp.r : inp.l, back = f.facing > 0 ? inp.l : inp.r;
    const air = f.y > 0 || f.vy > 0;
    f.t += dt;
    f.walking = 0;

    if (f.act === 'attack') {
      const mv = MOVES[f.move], before = f.phase;
      f.phase = attackPhase(f);
      if (before === 'active' && f.phase === 'recover' && !f.connected) ev(M, 'whiff', { x: f.x + f.facing * mv.reach * 0.8, y: 100, by: f.idx, move: f.move });
      if (mv.step && f.phase === 'startup') f.vx = mv.step * f.facing; else if (!air) f.vx = 0;
      if (!mv.air && f.t >= mv.startup + mv.active + mv.recover) { f.act = mv.crouch && inp.d ? 'crouch' : 'idle'; f.move = null; f.phase = null; f.t = 0; }
    } else if (f.act === 'block') {
      f.vx = -f.facing * 60;
      if (f.t >= T_BLOCK) { f.act = f.crouch ? 'crouch' : 'idle'; f.t = 0; }
    } else if (f.act === 'hit') {
      f.vx = -f.facing * 90 * Math.max(0, 1 - f.t / T_HIT);
      if (f.t >= T_HIT) { f.act = 'idle'; f.t = 0; }
    } else if (f.act === 'down') {
      f.vx = 0;
      if (f.t >= T_DOWN && live) { f.act = 'idle'; f.t = 0; }
    } else if (f.act === 'win' || f.act === 'lose') {
      f.vx = 0;
    } else if (f.act === 'jump') {
      if (live && (punch || kick)) { f.act = 'attack'; f.move = 'flykick'; f.t = 0; f.phase = 'startup'; f.connected = false; ev(M, 'swing', { by: f.idx, move: 'flykick' }); }
    } else if (live) {
      // grounded and free: idle / walk / crouch
      const mv = moveFor(f, inp, punch, kick);
      if (mv) {
        f.act = 'attack'; f.move = mv; f.t = 0; f.phase = 'startup'; f.connected = false; f.crouch = !!MOVES[mv].crouch; f.vx = 0;
        ev(M, 'swing', { by: f.idx, move: mv });
      } else if (jump) {
        f.act = 'jump'; f.t = 0; f.vy = JUMP_V; f.vx = fwd ? JUMP_X * f.facing : back ? -JUMP_X * f.facing : 0; f.crouch = false;
        ev(M, 'jump', { by: f.idx });
      } else if (inp.d) {
        if (f.act !== 'crouch') { f.act = 'crouch'; f.t = 0; }
        f.crouch = true; f.vx = 0;
      } else {
        f.crouch = false;
        if (fwd || back) { if (f.act !== 'walk') { f.act = 'walk'; f.t = 0; } f.walking = fwd ? 1 : -1; f.vx = fwd ? WALK * f.facing : -BACK_WALK * f.facing; }
        else { if (f.act !== 'idle') { f.act = 'idle'; f.t = 0; } f.vx = 0; }
      }
    } else if (!air) { f.vx = 0; if (f.act === 'walk') { f.act = 'idle'; f.t = 0; } }

    // blocking: holding back while free on the ground (or already in block stun)
    f.blocking = live && !air && back && (f.act === 'idle' || f.act === 'walk' || f.act === 'crouch' || f.act === 'block');

    // physics
    if (air || f.vy > 0) {
      f.vy -= GRAV * dt; f.y += f.vy * dt;
      if (f.y <= 0) {
        f.y = 0; f.vy = 0; f.vx = 0;
        if (f.act === 'jump' || (f.act === 'attack' && MOVES[f.move].air)) { f.act = 'idle'; f.move = null; f.phase = null; f.t = 0; ev(M, 'land', { by: f.idx, x: f.x }); }
      }
    }
    f.x += f.vx * dt;
    f.x = clamp(f.x, EDGE, ARENA_W - EDGE);
    if (f.act === 'idle' || f.act === 'walk' || f.act === 'crouch') f.facing = o.x >= f.x ? 1 : -1;
  }

  function separate(M) {
    const [a, b] = M.fighters;
    if (Math.abs(a.y - b.y) > 90) return;          // one is jumping over the other
    const dx = b.x - a.x, gap = Math.abs(dx);
    if (gap >= MIN_GAP) return;
    const push = (MIN_GAP - gap) / 2, s = dx >= 0 ? 1 : -1;
    a.x -= push * s; b.x += push * s;
    // against a wall, push the other one instead
    if (a.x < EDGE) { b.x += EDGE - a.x; a.x = EDGE; } if (a.x > ARENA_W - EDGE) { b.x -= a.x - (ARENA_W - EDGE); a.x = ARENA_W - EDGE; }
    if (b.x < EDGE) { a.x += EDGE - b.x; b.x = EDGE; } if (b.x > ARENA_W - EDGE) { a.x -= b.x - (ARENA_W - EDGE); b.x = ARENA_W - EDGE; }
  }

  // ---------- hits ----------
  const HEIGHT_Y = { high: 125, mid: 88, low: 22 };
  function check(a, d) {
    if (a.act !== 'attack' || a.phase !== 'active' || a.connected) return null;
    const mv = MOVES[a.move];
    const ahead = (d.x - a.x) * a.facing;
    if (ahead <= 0 || ahead > mv.reach + 18) return null;
    const dAir = d.y > 24, dCrouch = d.crouch && !dAir;
    const ay = mv.air ? a.y + 95 : HEIGHT_Y[mv.height];
    if (Math.abs(ay - (d.y + (dCrouch ? CROUCH_H : STAND_H) / 2)) > (dCrouch ? CROUCH_H : STAND_H) / 2 + 30) return null;  // vertical miss
    if (mv.height === 'high' && dCrouch) return null;
    if (mv.height === 'low' && dAir) return null;
    const canBlock = d.blocking && !dAir && (dCrouch ? mv.height !== 'high' : mv.height !== 'low');
    return { kind: canBlock ? 'block' : 'hit', points: mv.points, x: d.x - a.facing * 14, y: ay };
  }

  function resolveHits(M) {
    const [f0, f1] = M.fighters;
    const r0 = check(f0, f1), r1 = check(f1, f0);
    if (r0 && r1 && r0.kind === 'hit' && r1.kind === 'hit') {
      f0.connected = f1.connected = true;
      for (const f of M.fighters) { f.act = 'block'; f.t = 0; f.move = null; f.phase = null; }
      ev(M, 'clash', { x: (f0.x + f1.x) / 2, y: (r0.y + r1.y) / 2, by: -1 });
      return;
    }
    for (const [a, d, r] of [[f0, f1, r0], [f1, f0, r1]]) {
      if (!r) continue;
      a.connected = true;
      if (r.kind === 'block') {
        d.act = 'block'; d.t = 0; d.facing = a.x <= d.x ? -1 : 1;
        ev(M, 'block', { x: r.x, y: r.y, by: a.idx });
      } else if (M.phase === 'fight') {
        a.score += r.points;
        d.act = r.points >= 2 ? 'down' : 'hit'; d.t = 0; d.move = null; d.phase = null; d.crouch = false;
        if (d.y > 0 && d.act === 'hit') d.act = 'down';
        M.pointBy = a.idx;
        ev(M, 'hit', { x: r.x, y: r.y, by: a.idx, points: r.points });
        setPhase(M, 'point', (r.points >= 2 ? 'FULL POINT' : 'HALF POINT') + ' - ' + a.name);
        return;
      }
    }
  }

  // ---------- the match ----------
  function step(M, inputs, dt) {
    M.events = [];
    M.time += dt; M.phaseT += dt;
    const [f0, f1] = M.fighters, live = M.phase === 'fight';
    const i0 = (inputs && inputs[0]) || NEUTRAL, i1 = (inputs && inputs[1]) || NEUTRAL;
    // outside "fight" the fighters still finish what they were doing but take no new commands
    updFighter(M, f0, f1, live ? i0 : Object.assign({}, NEUTRAL, { pc: i0.pc, kc: i0.kc, jc: i0.jc }), dt, live);
    updFighter(M, f1, f0, live ? i1 : Object.assign({}, NEUTRAL, { pc: i1.pc, kc: i1.kc, jc: i1.jc }), dt, live);
    separate(M);
    if (live) {
      resolveHits(M);
      if (M.phase === 'fight') {
        M.timer = Math.max(0, M.timer - dt);
        if (M.timer <= 0) timeUp(M);
      }
    } else if (M.phase === 'intro') {
      if (M.introLong && M.phaseT > T_INTRO * 0.55) M.message = 'BEGIN';
      if (M.phaseT >= (M.introLong ? T_INTRO : T_REMARK)) { setPhase(M, 'fight', ''); ev(M, 'begin'); }
    } else if (M.phase === 'point') {
      if (M.phaseT >= T_POINT) {
        const a = M.fighters[M.pointBy];
        if (a.score >= POINTS_TO_WIN) endRound(M, a.idx, a.name + ' WINS ROUND ' + M.round);
        else { toMarks(M); M.introLong = false; setPhase(M, 'intro', 'BEGIN'); }
      }
    } else if (M.phase === 'roundOver') {
      if (M.phaseT >= T_ROUND) {
        const champ = M.fighters.find(f => f.rounds >= ROUNDS_TO_WIN);
        if (champ) { M.winner = champ.idx; setPhase(M, 'matchOver', champ.name + ' WINS!'); ev(M, 'matchOver', { by: champ.idx }); champ.act = 'win'; M.fighters[1 - champ.idx].act = 'lose'; }
        else nextRound(M);
      }
    }
    return M.events;
  }
  function timeUp(M) {
    const [a, b] = M.fighters;
    ev(M, 'time');
    if (a.score === b.score) endRound(M, -1, 'TIME - DRAW');
    else { const w = a.score > b.score ? a : b; endRound(M, w.idx, 'TIME - ' + w.name + ' WINS ROUND ' + M.round); }
  }
  function endRound(M, w, msg) {
    if (w >= 0) { M.fighters[w].rounds++; M.fighters[w].act = 'win'; M.fighters[1 - w].act = 'lose'; M.fighters.forEach(f => { f.t = 0; f.move = null; f.phase = null; f.crouch = false; }); }
    ev(M, 'roundOver', { by: w });
    setPhase(M, 'roundOver', msg);
  }
  function nextRound(M) {
    M.round++; M.timer = ROUND_TIME;
    M.fighters.forEach(f => { f.score = 0; });
    toMarks(M); M.introLong = true;
    setPhase(M, 'intro', 'ROUND ' + M.round);
  }

  // ---------- network snapshots (host -> joiner) ----------
  const r1 = v => Math.round(v * 10) / 10, r3 = v => Math.round(v * 1000) / 1000;
  function snapshot(M) {
    return { p: M.phase, pt: r3(M.phaseT), r: M.round, tm: r3(M.timer), msg: M.message, w: M.winner, pb: M.pointBy, il: M.introLong ? 1 : 0, sg: M.stage,
      f: M.fighters.map(f => [r1(f.x), r1(f.y), r1(f.vx), r1(f.vy), f.facing, ACTS.indexOf(f.act), f.move ? MOVE_NAMES.indexOf(f.move) : -1,
        r3(f.t), f.score, f.rounds, (f.crouch ? 1 : 0) | (f.blocking ? 2 : 0) | (f.connected ? 4 : 0), f.walking]) };
  }
  function applySnapshot(M, s) {
    M.phase = s.p; M.phaseT = s.pt; M.round = s.r; M.timer = s.tm; M.message = s.msg; M.winner = s.w; M.pointBy = s.pb; M.introLong = !!s.il; if (s.sg != null) M.stage = s.sg;
    s.f.forEach((a, i) => {
      const f = M.fighters[i];
      f.nx = a[0]; f.y = a[1]; f.vx = a[2]; f.vy = a[3]; f.facing = a[4]; f.act = ACTS[a[5]] || 'idle';
      f.move = a[6] >= 0 ? MOVE_NAMES[a[6]] : null; f.t = a[7]; f.score = a[8]; f.rounds = a[9];
      f.crouch = !!(a[10] & 1); f.blocking = !!(a[10] & 2); f.connected = !!(a[10] & 4); f.walking = a[11];
      f.phase = f.move ? attackPhase(f) : null;
      if (f.x === undefined || Math.abs(f.x - f.nx) > 120) f.x = f.nx;
    });
  }
  // between snapshots a joiner keeps animations moving and eases toward the host's positions
  function coast(M, dt) {
    M.phaseT += dt;
    if (M.phase === 'fight') M.timer = Math.max(0, M.timer - dt);
    for (const f of M.fighters) {
      f.t += dt;
      if (f.move) f.phase = attackPhase(f);
      if (f.nx !== undefined) { f.nx += f.vx * dt; f.x = lerp(f.x, f.nx, Math.min(1, dt * 18)); }
      if (f.y > 0 || f.vy > 0) { f.vy -= GRAV * dt; f.y = Math.max(0, f.y + f.vy * dt); }
    }
  }

  return { ARENA_W, FLOOR_Y, STAGE_H, START_X, MOVES, ACTS, ROUND_TIME, POINTS_TO_WIN, ROUNDS_TO_WIN, T_BLOCK, T_HIT, T_DOWN, STAND_H, CROUCH_H, NEUTRAL,
    create, step, snapshot, applySnapshot, coast, attackPhase };
})();

/* CPU opponent. Produces the same kind of input a player would ({ l, r, u, d, pc, kc, jc }),
   so the fight rules treat it exactly like a person. level 0..1 sets reaction time and accuracy. */
function makeCpu(level) {
  const m = { level: clamp(level, 0, 1), next: 0, hold: { l: false, r: false, u: false, d: false }, pc: 0, kc: 0, jc: 0, t: 0 };
  return function cpuInput(M, me, dt) {
    m.t += dt;
    const f = M.fighters[me], o = M.fighters[1 - me];
    const out = () => Object.assign({}, m.hold, { pc: m.pc, kc: m.kc, jc: m.jc });
    if (M.phase !== 'fight' || m.t < m.next) return out();
    const L = m.level, rnd = Math.random;
    m.next = m.t + lerp(0.32, 0.1, L) + rnd() * 0.1;
    const fwdKey = f.facing > 0 ? 'r' : 'l', backKey = f.facing > 0 ? 'l' : 'r';
    m.hold = { l: false, r: false, u: false, d: false };
    const dist = Math.abs(o.x - f.x);
    const busy = f.act === 'attack' || f.act === 'hit' || f.act === 'down' || f.act === 'block' || f.act === 'jump';
    if (busy) {
      if (f.act === 'jump' && dist < 190 && rnd() < 0.5 + L * 0.4) m.kc++;
      return out();
    }
    // defend against an attack that is coming
    if (o.act === 'attack' && o.phase !== 'recover') {
      const mv = Fight.MOVES[o.move];
      if (dist < mv.reach + 30 && rnd() < 0.25 + L * 0.55) {
        if (mv.height === 'low' && rnd() < 0.5) { m.jc++; return out(); }
        m.hold[backKey] = true;
        if (mv.height !== 'high' && mv.height !== 'mid') m.hold.d = true;
        else if (mv.height === 'high' && rnd() < 0.5) m.hold.d = true;   // duck under it
        return out();
      }
    }
    // punish a whiffed move
    const opening = o.act === 'attack' && o.phase === 'recover' || o.act === 'hit';
    const inRange = reach => dist <= reach + 6;
    const choices = [];
    if (inRange(82)) choices.push(['jab', 2], ['lowpunch', 1.5]);
    if (inRange(96) && dist > 60) choices.push(['lunge', 1]);
    if (inRange(106)) choices.push(['frontkick', 2]);
    if (inRange(118)) choices.push(['roundhouse', 1.5 + L]);
    if (inRange(116)) choices.push(['sweep', o.crouch ? 0.5 : 1.2 + L]);
    if (inRange(130) && dist > 90) choices.push(['spinkick', 0.8]);
    const attackChance = opening ? 0.9 : 0.25 + L * 0.35;
    if (choices.length && rnd() < attackChance) {
      let tot = choices.reduce((s, c) => s + c[1], 0), pick = rnd() * tot, mv = choices[0][0];
      for (const c of choices) { pick -= c[1]; if (pick <= 0) { mv = c[0]; break; } }
      if (mv === 'jab') m.pc++;
      else if (mv === 'lowpunch') { m.hold.d = true; m.pc++; }
      else if (mv === 'lunge') { m.hold[fwdKey] = true; m.pc++; }
      else if (mv === 'frontkick') m.kc++;
      else if (mv === 'roundhouse') { m.hold[fwdKey] = true; m.kc++; }
      else if (mv === 'spinkick') { m.hold[backKey] = true; m.kc++; }
      else if (mv === 'sweep') { m.hold.d = true; m.kc++; }
      return out();
    }
    if (dist > 150 && dist < 240 && rnd() < 0.08 + L * 0.1) { m.hold[fwdKey] = true; m.jc++; return out(); }
    if (dist > 125) { if (rnd() < 0.85) m.hold[fwdKey] = true; }
    else if (dist < 80 && rnd() < 0.4) m.hold[backKey] = true;
    else if (rnd() < 0.3) m.hold[rnd() < 0.5 ? fwdKey : backKey] = true;
    return out();
  };
}

<script>
/* Render: everything drawn during a match. Stages, fighters, hit effects and the fight HUD.
   Reads the match only; it never changes the simulation, so online play stays in sync.

   Contract with game.js:
     Render.drawWorld(ctx, M, view)  arena + both fighters + effects
     Render.drawHUD(ctx, M, view)    scores, rounds, timer, message banner
   Before each call game.js sets ctx's transform so 1 unit = 1 logical stage pixel on a
   Fight.ARENA_W x Fight.STAGE_H (960 x 540) stage; the floor line is at y = Fight.FLOOR_Y.

<script>
/* Net: transport-agnostic messaging for online matches.
   A transport connects everyone in one room (named by a short room code) and offers:
     id                      this player's id in the room
     send(to, msg)           message one player
     broadcast(msg)          message everyone else in the room (a joiner's broadcast reaches the host)
     onMessage(fn(from,msg)) receive
     close()
   Optional voice chat: voiceStart() -> Promise, voiceStop(), voiceSync(ids), voiceMute(bool).
   The game uses a host-authoritative model: the host simulates the fight and broadcasts snapshots;
   joiners only send their controls. Transports:
     peer  - WebRTC peer-to-peer via PeerJS. The free public PeerJS server only introduces players;
             game data and voice then flow directly between their computers. Needs internet.
     local - BroadcastChannel: windows/tabs on the same computer (testing; add ?net=local to the URL)
   Problems are reported to the game as a { t: 'neterr', msg } message. */
const Net = (() => {
  const randId = () => Math.random().toString(36).slice(2, 10);
  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // no I/O/0/1 to avoid confusion
  const newCode = () => Array.from({ length: 4 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
  const cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
  const params = (() => { try { return new URLSearchParams(location.search); } catch (e) { return new URLSearchParams(''); } })();

  function localTransport(code) {
    if (typeof BroadcastChannel === 'undefined') throw new Error('BroadcastChannel not supported');
    const id = randId(), ch = new BroadcastChannel('karatefight-room-' + code);
    let handler = () => {};
    ch.onmessage = e => {
      const m = e.data;
      if (!m || m.from === id || (m.to && m.to !== id)) return;
      try { handler(m.from, m.body); } catch (err) { console.error(err); }
    };
    return {
      id, kind: 'local',
      send(to, body) { ch.postMessage({ from: id, to, body }); },
      broadcast(body) { ch.postMessage({ from: id, body }); },
      onMessage(fn) { handler = fn; },
      close() { try { ch.close(); } catch (e) {} }
    };
  }

  function peerTransport(code, role) {
    if (typeof Peer === 'undefined') throw new Error('PeerJS not loaded');
    const hostPid = 'kfight-' + code;
    const id = role === 'host' ? hostPid : hostPid + '-' + randId();
    const opts = { debug: 0, config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] } };
    if (params.get('peerhost')) Object.assign(opts, { host: params.get('peerhost'), port: +params.get('peerport') || 9000, path: '/', secure: false });
    const peer = new Peer(id, opts);
    const conns = {};               // peer id -> open DataConnection
    let handler = () => {}, closed = false;
    const deliver = (from, m) => { if (!closed) try { handler(from, m); } catch (err) { console.error(err); } };
    const fail = msg => deliver(role === 'host' ? id : hostPid, { t: 'neterr', msg });

    function wire(conn) {
      conn.on('open', () => { conns[conn.peer] = conn; });
      conn.on('data', d => deliver(conn.peer, d));
      conn.on('close', () => {
        if (conns[conn.peer] !== conn) return;
        delete conns[conn.peer];
        deliver(conn.peer, role === 'host' ? { t: 'bye' } : { t: 'closed' });
      });
      conn.on('error', e => console.warn('conn error', e));
    }
    peer.on('open', () => {
      if (role !== 'host') wire(peer.connect(hostPid, { serialization: 'json', reliable: true }));
    });
    if (role === 'host') peer.on('connection', conn => { if (conn.peer.startsWith(hostPid + '-')) wire(conn); else conn.close(); });
    peer.on('error', e => {
      const t = e && e.type;
      if (t === 'peer-unavailable') fail('No room found with code ' + code);
      else if (t === 'unavailable-id') fail('Room code ' + code + ' is busy, try hosting again');
      else if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') fail('Could not reach the online server. Check your internet connection.');
      else if (t === 'browser-incompatible') fail('This browser cannot play online');
      else console.warn('peer error', t, e);
    });
    peer.on('disconnected', () => { if (!closed) try { peer.reconnect(); } catch (e) {} });

    // ---- voice chat: a full mesh of audio calls between players who switched voice on ----
    let mic = null, muted = false;
    const calls = {};               // peer id -> { call, audio }
    function endCall(pid) {
      const c = calls[pid]; if (!c) return;
      delete calls[pid];
      try { c.call.close(); } catch (e) {}
      if (c.audio) { c.audio.srcObject = null; c.audio.remove(); }
    }
    function attach(pid, call) {
      endCall(pid);
      const rec = { call, audio: null };
      calls[pid] = rec;
      call.on('stream', s => {
        if (rec.audio) return;
        const a = document.createElement('audio');
        a.autoplay = true; a.playsInline = true; a.srcObject = s; a.style.display = 'none';
        document.body.appendChild(a); rec.audio = a;
        const p = a.play(); if (p && p.catch) p.catch(() => {});
      });
      call.on('close', () => { if (calls[pid] === rec) endCall(pid); });
      call.on('error', () => { if (calls[pid] === rec) endCall(pid); });
    }
    peer.on('call', call => {
      if (!mic) { call.close(); return; }
      call.answer(mic); attach(call.peer, call);
    });

    return {
      id, kind: 'peer',
      send(to, body) { const c = conns[to]; if (c && c.open) c.send(body); },
      broadcast(body) { for (const k in conns) if (conns[k].open) conns[k].send(body); },
      onMessage(fn) { handler = fn; },
      close() {
        this.voiceStop();
        setTimeout(() => { closed = true; for (const k in conns) try { conns[k].close(); } catch (e) {} try { peer.destroy(); } catch (e) {} }, 150);
      },
      get voiceOn() { return !!mic; },
      get voiceLinks() { return Object.values(calls).filter(c => c.audio).length; },
      voiceStart() {
        if (mic) return Promise.resolve();
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.reject(new Error('No microphone access here'));
        return navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false })
          .then(s => { mic = s; this.voiceMute(muted); });
      },
      voiceStop() {
        Object.keys(calls).forEach(endCall);
        if (mic) mic.getTracks().forEach(t => t.stop());
        mic = null;
      },
      voiceMute(on) { muted = !!on; if (mic) mic.getAudioTracks().forEach(t => { t.enabled = !muted; }); },
      // ids: everyone else who has voice switched on. The lower id places each call, so each pair is called once.
      voiceSync(ids) {
        if (!mic) return;
        Object.keys(calls).forEach(pid => { if (!ids.includes(pid)) endCall(pid); });
        for (const pid of ids) if (!calls[pid] && id < pid) attach(pid, peer.call(pid, mic));
      }
    };
  }

  const transports = { local: localTransport, peer: peerTransport };
  let preferred = params.get('net') === 'local' || typeof Peer === 'undefined' ? 'local' : 'peer';

  return {
    newCode, cleanCode,
    get transportName() { return preferred; },
    use(name) { if (transports[name]) preferred = name; },
    register(name, factory) { transports[name] = factory; },
    connect(code, role) { return transports[preferred](cleanCode(code), role || 'join'); }
  };
})();

</script>
<script>
/* =====================================================================
   KARATE FIGHT - an original two-fighter karate game
   Modes: 1 player vs CPU, 2 players on one computer, and online versus.
   Game rules live in fight.js, drawing in render.js, online transport in net.js.
   ===================================================================== */

const STEP = 1 / 120;
const W = Fight.ARENA_W, H = Fight.STAGE_H;
const settings = Object.assign({ name: '', level: 1 }, store.get('settings', {}));
const saveSettings = () => store.set('settings', settings);
const LEVELS = ['Easy', 'Normal', 'Hard'];

let state = 'menu';          // menu | help | online | lobby | play | paused
let mode = 'cpu';            // cpu | duo | online
let match = null, cpu = null, labels = null, net = null;
let menuSel = 0, menuNote = null;
const demo = { m: null, a: null, b: null };
const note = t => { menuNote = { text: t, until: performance.now() + 5000 }; };

// ---------- controls ----------
const BIND = {
  solo: { l: ['ArrowLeft', 'KeyA'], r: ['ArrowRight', 'KeyD'], u: ['ArrowUp', 'KeyW'], d: ['ArrowDown', 'KeyS'], p: ['KeyF', 'KeyZ', 'Period'], k: ['KeyG', 'KeyX', 'Slash'] },
  p1: { l: ['KeyA'], r: ['KeyD'], u: ['KeyW'], d: ['KeyS'], p: ['KeyF'], k: ['KeyG'] },
  p2: { l: ['ArrowLeft'], r: ['ArrowRight'], u: ['ArrowUp'], d: ['ArrowDown'], p: ['Period'], k: ['Slash'] }
};
function readInput(bind, pad) {
  const held = list => list.some(c => keys[c]), count = list => list.reduce((s, c) => s + (presses[c] || 0), 0);
  const gp = pad >= 0 ? GamepadInput.pads[pad] : null;
  return {
    l: held(bind.l) || !!(gp && gp.l), r: held(bind.r) || !!(gp && gp.r),
    u: held(bind.u) || !!(gp && gp.u), d: held(bind.d) || !!(gp && gp.d),
    pc: count(bind.p) + (gp ? gp.pc : 0), kc: count(bind.k) + (gp ? gp.kc : 0), jc: count(bind.u) + (gp ? gp.jc : 0)
  };
}
// in 2-player mode: two pads -> one each; one pad -> player 2 (player 1 has the keyboard)
function duoPads() { const a = GamepadInput.pads[0].active, b = GamepadInput.pads[1].active; return a && b ? [0, 1] : a ? [-1, 0] : [-1, -1]; }
function localInputs() {
  if (mode === 'duo') { const p = duoPads(); return [readInput(BIND.p1, p[0]), readInput(BIND.p2, p[1])]; }
  return [readInput(BIND.solo, 0), null];
}

// ---------- starting matches ----------
function startMatch(m, names) {
  mode = m;
  labels = null;
  if (m === 'cpu') { cpu = makeCpu([0.25, 0.6, 0.95][settings.level]); names = [settings.name || 'You', 'CPU']; }
  else cpu = null;
  if (m === 'duo') names = ['Player 1', 'Player 2'];
  match = Fight.create({ p1: { name: names[0].toUpperCase(), color: 'white' }, p2: { name: names[1].toUpperCase(), color: 'red' } });
  if (m === 'online') labels = net.roster.map(r => r.name.toUpperCase() + (r.id === net.me ? ' (YOU)' : ''));
  state = 'play'; acc = 0;
  Sound.play('menuSelect');
}
function goMenu() { leaveOnline(true); match = null; state = 'menu'; }

// ---------- online play ----------
// Host-authoritative, as in Drift Rivals: the host runs the fight and sends snapshots 30 times a
// second; the joiner sends its controls (with press counts, so no tap is lost) and draws what the host sends.
function onlineHost(name) {
  leaveOnline(true);
  const code = Net.newCode(), t = Net.connect(code, 'host');
  net = { role: 'host', t, code, me: t.id, roster: [{ id: t.id, name }], input: null, seen: {}, sendAcc: 0, evq: [] };
  t.onMessage(hostOnMessage);
  state = 'lobby'; Sound.play('menuSelect');
}
function onlineJoin(name, code) {
  leaveOnline(true);
  const t = Net.connect(code, 'join');
  net = { role: 'client', t, code: Net.cleanCode(code), me: t.id, hostId: null, roster: [], name, status: 'Looking for room ' + Net.cleanCode(code) + '…',
    helloAt: 0, startedAt: performance.now(), lastIn: 0, lastSent: '', lastSnap: 0 };
  t.onMessage(clientOnMessage);
  state = 'lobby'; Sound.play('menuSelect');
}
function leaveOnline(silent) {
  if (!net) return;
  try { net.t.broadcast(net.role === 'host' ? { t: 'closed' } : { t: 'bye' }); net.t.close(); } catch (e) {}
  net = null;
  if (!silent) { match = null; state = 'menu'; }
}
addEventListener('beforeunload', () => leaveOnline(true));

function voiceAvailable() { return !!(net && net.t.voiceStart); }
function toggleVoice() {
  if (!voiceAvailable()) { note('Voice chat works in online rooms over the internet'); return; }
  if (net.voice) { net.voice = false; net.t.voiceStop(); setMyVoice(false); return; }
  net.voiceAsk = true;
  net.t.voiceStart().then(() => { if (!net) return; net.voice = true; net.voiceAsk = false; setMyVoice(true); Sound.play('menuSelect'); })
    .catch(() => { if (net) net.voiceAsk = false; note('Microphone not available. Check your browser or Mac privacy settings.'); });
}
function setMyVoice(on) {
  const me = net.roster.find(r => r.id === net.me); if (me) me.voice = on;
  if (net.role === 'host') broadcastRoster(); else if (net.hostId) net.t.send(net.hostId, { t: 'voice', on });
  syncVoice();
}
function syncVoice() { if (net && net.voice && net.t.voiceSync) net.t.voiceSync(net.roster.filter(r => r.voice && r.id !== net.me).map(r => r.id)); }

function broadcastRoster() { if (net && net.role === 'host') net.t.broadcast({ t: 'roster', roster: net.roster }); }
function dropOpponent(id) {
  const i = net.roster.findIndex(r => r.id === id); if (i <= 0) return;
  const gone = net.roster.splice(i, 1)[0];
  delete net.seen[id]; net.input = null;
  note(gone.name + ' left');
  if (state === 'play' || state === 'paused') { match = null; state = 'lobby'; }
  broadcastRoster();
}
function hostOnMessage(from, m) {
  if (!m || !net) return;
  net.seen[from] = performance.now();
  if (m.t === 'neterr') { leaveOnline(); note(m.msg); return; }
  if (m.t === 'voice') { const r = net.roster.find(r => r.id === from); if (r) { r.voice = !!m.on; broadcastRoster(); syncVoice(); } return; }
  if (m.t === 'hello') {
    const known = net.roster.find(r => r.id === from);
    if (known) Object.assign(known, { name: String(m.name || 'Player').slice(0, 12), voice: !!m.voice });
    else if (net.roster.length >= 2) { net.t.send(from, { t: 'full' }); return; }
    else if (state !== 'lobby') { net.t.send(from, { t: 'busy' }); return; }
    else { net.roster.push({ id: from, name: String(m.name || 'Player').slice(0, 12), voice: !!m.voice }); Sound.play('menuMove'); }
    broadcastRoster();
  } else if (m.t === 'input' && m.c && net.roster[1] && net.roster[1].id === from) {
    const c = m.c;
    net.input = { l: !!c.l, r: !!c.r, u: !!c.u, d: !!c.d, pc: c.pc | 0, kc: c.kc | 0, jc: c.jc | 0 };
  } else if (m.t === 'bye') dropOpponent(from);
}
function hostStart() {
  if (!net || net.role !== 'host' || net.roster.length < 2) return;
  net.input = null;
  net.t.broadcast({ t: 'start', roster: net.roster });
  startMatch('online', net.roster.map(r => r.name));
}
function hostSend(dt, evs) {
  if (state !== 'play' && state !== 'paused') return;
  net.evq.push(...evs);
  net.sendAcc += dt;
  if (net.sendAcc < 1 / 30) return;
  net.sendAcc = 0;
  const s = Fight.snapshot(match);
  s.t = 'snap'; s.ev = net.evq.filter(e => e.type !== 'whiff').map(e => [e.type, Math.round(e.x || 0), Math.round(e.y || 0), e.by, e.points || 0]);
  net.t.broadcast(s);
  net.evq = [];
}
function clientOnMessage(from, m) {
  if (!m || !net) return;
  if (m.t === 'neterr') { leaveOnline(); note(m.msg); return; }
  if (net.hostId && from !== net.hostId) return;
  net.lastIn = performance.now();
  if (m.t === 'roster') {
    if (!m.roster.some(r => r.id === net.me)) return;
    net.hostId = from; net.roster = m.roster; net.status = 'In the room. Waiting for the host to start…';
    syncVoice();
  } else if (m.t === 'full' || m.t === 'busy') {
    leaveOnline(); note(m.t === 'full' ? 'That room already has two fighters' : 'That room is mid-fight; try again in a moment');
  } else if (m.t === 'start') {
    net.roster = m.roster; startMatch('online', m.roster.map(r => r.name));
  } else if (m.t === 'snap') {
    if (!match) return;
    Fight.applySnapshot(match, m);
    net.lastSnap = performance.now();
    const evs = (m.ev || []).map(a => ({ type: a[0], x: a[1], y: a[2], by: a[3], points: a[4] }));
    net.pendingEv = (net.pendingEv || []).concat(evs);
    Sound.events(evs);
  } else if (m.t === 'lobby') { match = null; state = 'lobby'; }
  else if (m.t === 'closed') { leaveOnline(); note('The host closed the room'); }
}
function hostToLobby() { if (!net || net.role !== 'host') return; match = null; state = 'lobby'; net.t.broadcast({ t: 'lobby' }); broadcastRoster(); }
function netPoll() {
  if (!net) return;
  const now = performance.now();
  if (net.voice && now - (net.voiceAt || 0) > 2000) { net.voiceAt = now; syncVoice(); }
  if (net.role === 'client') {
    if (!net.hostId) {
      if (now - net.helloAt > 1000) { net.helloAt = now; net.t.broadcast({ t: 'hello', name: net.name, voice: !!net.voice }); }
      if (now - net.startedAt > (net.t.kind === 'peer' ? 20000 : 8000)) { const code = net.code; leaveOnline(); note('No room found with code ' + code); }
      return;
    }
    const k = readInput(BIND.solo, 0), sig = JSON.stringify(k);
    if (sig !== net.lastSent || now - (net.lastOut || 0) > 500) { net.lastSent = sig; net.lastOut = now; net.t.send(net.hostId, { t: 'input', c: k }); }
    if (now - net.lastIn > 8000) { leaveOnline(); note('Lost the connection to the host'); }
  } else {
    if (net.roster[1] && now - (net.seen[net.roster[1].id] || now) > 6000) dropOpponent(net.roster[1].id);
  }
}

// lobby + join form (HTML so typing works on every keyboard)
const onlineForm = (() => {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:5;pointer-events:none';
  d.innerHTML = '<div style="pointer-events:auto;background:rgba(18,12,10,0.94);border-radius:16px;padding:26px 30px;width:min(420px,90vw);color:#fff;font:15px -apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;box-shadow:0 10px 40px rgba(0,0,0,.5)">'
    + '<div style="font-weight:800;font-size:24px;margin-bottom:14px">Online versus</div>'
    + '<label style="display:block;color:#d9c3a8;font-size:13px;margin-bottom:4px">Your name</label>'
    + '<input id="kf-name" maxlength="12" style="width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #543;background:#231a15;color:#fff;margin-bottom:16px">'
    + '<button id="kf-host" style="width:100%;font:inherit;font-weight:700;padding:12px;border:0;border-radius:10px;background:#c0302a;color:#fff;cursor:pointer">Host a new room</button>'
    + '<div style="text-align:center;color:#8a7766;margin:14px 0;font-size:13px">or join a friend</div>'
    + '<div style="display:flex;gap:8px"><input id="kf-code" maxlength="6" placeholder="ROOM CODE" style="flex:1;min-width:0;font:inherit;letter-spacing:3px;text-transform:uppercase;padding:10px 12px;border-radius:10px;border:1px solid #543;background:#231a15;color:#fff">'
    + '<button id="kf-join" style="font:inherit;font-weight:700;padding:10px 18px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer">Join</button></div>'
    + '<button id="kf-back" style="margin-top:16px;width:100%;font:inherit;padding:10px;border:0;border-radius:10px;background:transparent;color:#d9c3a8;cursor:pointer">Back (Esc)</button></div>';
  document.body.appendChild(d);
  const $ = id => d.querySelector('#' + id);
  const name = () => { const v = $('kf-name').value.trim() || 'Player'; settings.name = v; saveSettings(); return v; };
  $('kf-host').onclick = () => onlineHost(name());
  $('kf-join').onclick = () => { const c = Net.cleanCode($('kf-code').value); if (c.length >= 4) onlineJoin(name(), c); else $('kf-code').focus(); };
  $('kf-code').addEventListener('keydown', e => { if (e.key === 'Enter') $('kf-join').onclick(); });
  $('kf-back').onclick = () => goMenu();
  d.addEventListener('keydown', e => { if (e.key === 'Escape') goMenu(); });
  d.open = () => { $('kf-name').value = settings.name || ''; setTimeout(() => ($('kf-name').value ? $('kf-code') : $('kf-name')).focus(), 30); };
  return d;
})();

// ---------- UI helpers (stage coordinates) ----------
let uiButtons = [], stageS = 1, stageX = 0, stageY = 0;
function text(str, x, y, size, col, align, weight) {
  ctx.font = (weight || '700') + ' ' + size + 'px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif';
  ctx.fillStyle = col; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle'; ctx.fillText(str, x, y);
}
function panel(x, y, w, h) { ctx.fillStyle = 'rgba(18,12,10,0.78)'; rr(ctx, x, y, w, h, 12); ctx.fill(); }
function button(label, x, y, w, h, action, primary) {
  uiButtons.push({ x, y, w, h, action });
  ctx.fillStyle = primary ? '#c0302a' : 'rgba(255,255,255,0.14)'; rr(ctx, x, y, w, h, 10); ctx.fill();
  text(label, x + w / 2, y + h / 2 + 1, 16, '#fff', 'center', '700');
}
cvs.addEventListener('pointerdown', e => {
  const x = (e.clientX - stageX) / stageS, y = (e.clientY - stageY) / stageS;
  for (const b of uiButtons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.action(); break; }
});

const MENU = [
  { label: () => '1 PLAYER vs CPU', go: () => startMatch('cpu') },
  { label: () => '2 PLAYERS (same computer)', go: () => startMatch('duo') },
  { label: () => 'ONLINE VERSUS', go: () => { state = 'online'; onlineForm.open(); Sound.play('menuSelect'); } },
  { label: () => 'CPU LEVEL:  ◀ ' + LEVELS[settings.level] + ' ▶', go: () => shiftLevel(1), side: d => shiftLevel(d) },
  { label: () => 'HOW TO PLAY', go: () => { state = 'help'; Sound.play('menuSelect'); } }
];
function shiftLevel(d) { settings.level = (settings.level + d + 3) % 3; saveSettings(); Sound.play('menuMove'); }

function drawMenu(t) {
  text('KARATE FIGHT', W / 2, 92, 72, '#fff', 'center', '900');
  text('Two fighters. One point at a time.', W / 2, 140, 18, '#ffe7c4', 'center', '600');
  MENU.forEach((it, i) => {
    const y = 190 + i * 54, sel = i === menuSel;
    uiButtons.push({ x: W / 2 - 200, y, w: 400, h: 44, action: () => { menuSel = i; it.go(); } });
    ctx.fillStyle = sel ? '#c0302a' : 'rgba(18,12,10,0.7)'; rr(ctx, W / 2 - 200, y, 400, 44, 10); ctx.fill();
    text(it.label(), W / 2, y + 23, 19, '#fff', 'center', '800');
  });
  if (menuNote && performance.now() < menuNote.until) text(menuNote.text, W / 2, 482, 16, '#ffd84a', 'center', '700');
  text('Arrows + Enter to choose  ·  M sound: ' + (Sound.muted ? 'OFF' : 'on') + '  ·  N music: ' + (Sound.musicOn ? 'on' : 'OFF') + '  ·  F11 / ⌃⌘F fullscreen', W / 2, 515, 13, 'rgba(255,255,255,0.7)', 'center', '500');
}
function drawHelp() {
  panel(70, 40, W - 140, H - 80);
  text('HOW TO PLAY', W / 2, 78, 32, '#fff', 'center', '900');
  const rows = [
    ['Score', 'Clean hit = half or full point. First to 2 full points wins the round; best of 3 rounds.'],
    ['Block', 'Hold away from your opponent. Crouch-block (down + away) stops sweeps.'],
    ['Punch', 'Jab · forward+punch: lunge · down+punch: low punch  (half points)'],
    ['Kick', 'Front kick (half) · forward+kick: roundhouse · away+kick: spin kick · down+kick: sweep (full)'],
    ['Jump', 'Up to jump (with a direction to leap), then kick or punch for a flying kick (full point).'],
    ['1 player', 'Arrows or WASD to move · Z / F / . punch · X / G / / kick'],
    ['2 players', 'P1: W A S D, F punch, G kick  ·  P2: arrows, . punch, / kick'],
    ['Pads', 'Stick/d-pad move · X/Square punch · B/Circle or Y/Triangle kick · A/Cross jump'],
    ['Online', 'Host a room and share the 4-letter code, or join with a code. V = voice chat.']
  ];
  rows.forEach((r, i) => { text(r[0], 110, 130 + i * 38, 16, '#ffd84a', 'left', '800'); text(r[1], 220, 130 + i * 38, 15, '#fff', 'left', '500'); });
  button('Back (Esc)', W / 2 - 90, H - 92, 180, 40, () => { state = 'menu'; }, true);
}
function drawLobby() {
  panel(180, 40, W - 360, H - 80);
  const cx = W / 2, host = net && net.role === 'host';
  text('ONLINE VERSUS', cx, 78, 32, '#fff', 'center', '900');
  if (!net) return;
  text('Room code', cx, 118, 14, '#d9c3a8', 'center', '600');
  text(net.code, cx, 154, 52, '#ffd84a', 'center', '900');
  for (let k = 0; k < 2; k++) {
    const r = net.roster[k], y = 214 + k * 44;
    ctx.fillStyle = k ? '#d63a32' : '#f1f1ea'; ctx.beginPath(); ctx.arc(cx - 160, y, 10, 0, Math.PI * 2); ctx.fill();
    text(r ? r.name + (r.id === net.me ? '  (you)' : '') + (k === 0 ? '  ★ host' : '') + (r.voice ? '  🎤' : '') : '— waiting for a fighter —', cx - 138, y, 18, r ? '#fff' : '#8a7766', 'left', '700');
  }
  if (host) {
    if (net.roster.length >= 2) button('START FIGHT (Enter)', cx - 120, 310, 240, 48, hostStart, true);
    else text('Share the code with a friend so they can join.', cx, 334, 15, '#d9c3a8', 'center', '600');
  } else text(net.status, cx, 334, 15, '#d9c3a8', 'center', '600');
  if (voiceAvailable()) button(net.voiceAsk ? 'Allow the mic…' : net.voice ? '🎤 Voice on (V)' : 'Voice chat off (V)', cx - 200, 390, 190, 42, toggleVoice, net.voice);
  button('Leave (Esc)', cx + (voiceAvailable() ? 10 : -95), 390, 190, 42, () => leaveOnline());
  if (Net.transportName === 'local') text('Preview mode: open the game in another window on this computer and join with the code.', cx, 460, 12, '#8a7766', 'center', '500');
  if (menuNote && performance.now() < menuNote.until) text(menuNote.text, cx, 480, 15, '#ffd84a', 'center', '700');
}
function overActive() { return match && match.phase === 'matchOver' && match.phaseT > 1.4; }
function drawOver() {
  const cx = W / 2;
  if (mode === 'online' && net && net.role === 'client') { text('Waiting for the host…  (Esc to leave)', cx, 300, 18, '#fff', 'center', '700'); return; }
  button('Rematch (Enter)', cx - 200, 290, 190, 46, rematch, true);
  button(mode === 'online' ? 'Lobby (Esc)' : 'Menu (Esc)', cx + 10, 290, 190, 46, () => mode === 'online' ? hostToLobby() : goMenu());
}
function rematch() { if (mode === 'online') hostStart(); else startMatch(mode); }
function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
  text('PAUSED', W / 2, 200, 48, '#fff', 'center', '900');
  button('Resume (P)', W / 2 - 200, 260, 190, 46, () => { state = 'play'; }, true);
  button('Quit (Esc)', W / 2 + 10, 260, 190, 46, goMenu);
}

function handleKeys() {
  if (tap('KeyM')) Sound.toggleMute();
  if (tap('KeyN')) Sound.toggleMusic();
  if (state === 'menu') {
    if (tap('ArrowUp') || tap('KeyW')) { menuSel = (menuSel + MENU.length - 1) % MENU.length; Sound.play('menuMove'); }
    if (tap('ArrowDown') || tap('KeyS')) { menuSel = (menuSel + 1) % MENU.length; Sound.play('menuMove'); }
    if (MENU[menuSel].side) { if (tap('ArrowLeft')) MENU[menuSel].side(-1); if (tap('ArrowRight')) MENU[menuSel].side(1); }
    if (tap('Enter') || tap('Space')) MENU[menuSel].go();
  } else if (state === 'help') { if (tap('Escape') || tap('Enter')) state = 'menu'; }
  else if (state === 'online') { if (tap('Escape')) goMenu(); }
  else if (state === 'lobby') {
    if (tap('Escape')) leaveOnline();
    if (tap('KeyV')) toggleVoice();
    if (tap('Enter')) hostStart();
  } else if (state === 'paused') {
    if (tap('KeyP') || tap('Enter')) state = 'play';
    if (tap('Escape')) goMenu();
  } else if (state === 'play') {
    if (mode === 'online') {
      if (tap('KeyV')) toggleVoice();
      if (tap('Escape')) {
        if (overActive() && net && net.role === 'host') hostToLobby();
        else if (net && performance.now() - (net.leaveArm || 0) < 2500) leaveOnline();
        else if (net) { net.leaveArm = performance.now(); note('Press Esc again to leave'); }
      }
      if (overActive() && tap('Enter')) rematch();
    } else if (overActive()) { if (tap('Enter')) rematch(); if (tap('Escape')) goMenu(); }
    else if (tap('KeyP') || tap('Escape')) state = 'paused';
  }
}

// ---------- main loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  GamepadInput.poll();
  handleKeys();
  netPoll();
  let evs = [];
  if (state === 'play' && match) {
    if (net && net.role === 'client') { match.events = net.pendingEv || []; net.pendingEv = []; Fight.coast(match, dt); }
    else {
      acc += dt;
      while (acc >= STEP) {
        const inp = localInputs();
        if (mode === 'cpu') inp[1] = cpu(match, 1, STEP);
        if (mode === 'online') inp[1] = net && net.input;
        evs = evs.concat(Fight.step(match, inp, STEP));
        acc -= STEP;
      }
      match.events = evs;
      Sound.events(evs);
    }
  }
  if (net && net.role === 'host') hostSend(dt, evs);

  // menu backdrop: two CPUs sparring
  const inMenus = state !== 'play' && state !== 'paused';
  Sound.music(inMenus ? 'menu' : 'fight');
  if (inMenus) {
    if (!demo.m || demo.m.phase === 'matchOver') { demo.m = Fight.create({ p1: { name: 'WHITE' }, p2: { name: 'RED', color: 'red' } }); demo.a = makeCpu(0.5); demo.b = makeCpu(0.5); }
    let e = []; for (let k = 0; k < Math.round(dt / STEP); k++) e = e.concat(Fight.step(demo.m, [demo.a(demo.m, 0, STEP), demo.b(demo.m, 1, STEP)], STEP));
    demo.m.events = e;
  }

  onlineForm.style.display = state === 'online' ? 'flex' : 'none';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#120c0a'; ctx.fillRect(0, 0, VW, VH);
  stageS = Math.min(VW / W, VH / H); stageX = (VW - W * stageS) / 2; stageY = (VH - H * stageS) / 2;
  ctx.setTransform(DPR * stageS, 0, 0, DPR * stageS, DPR * stageX, DPR * stageY);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  uiButtons = [];
  const view = { t: now / 1000, dt, labels };
  if (inMenus) {
    Render.drawWorld(ctx, demo.m, view);
    ctx.fillStyle = 'rgba(10,6,4,0.45)'; ctx.fillRect(0, 0, W, H);
    if (state === 'menu') drawMenu(now / 1000); else if (state === 'help') drawHelp(); else if (state === 'lobby') drawLobby();
    else text('KARATE FIGHT', W / 2, 70, 56, '#fff', 'center', '900');
  } else if (match) {
    Render.drawWorld(ctx, match, view);
    Render.drawHUD(ctx, match, view);
    if (mode === 'online' && net && net.voice) text('🎤', W / 2, 100, 16, '#222', 'center');
    if (overActive()) drawOver();
    if (state === 'paused') drawPause();
    if (menuNote && performance.now() < menuNote.until) text(menuNote.text, W / 2, H - 30, 16, '#fff', 'center', '700');
  }
  ctx.restore();
  for (const k in pressed) pressed[k] = false;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// hooks for automated testing (harmless in normal play)
window.__game = { get net() { return net; }, get match() { return match; }, get state() { return state; }, get mode() { return mode; },
  onlineHost, onlineJoin, hostStart, leaveOnline, startMatch, goMenu, rematch, hostToLobby };

</script>
</body>
</html>
